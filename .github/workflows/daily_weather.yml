name: Daily Weather Fetch

on:
  schedule:
    # Chạy lúc 7:00 sáng giờ Việt Nam (UTC+7) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:  # Cho phép chạy thủ công từ GitHub UI

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Cần quyền này để commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weather data
        run: python fetch_weather.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p data/weather
          git add data/weather/

          # Chỉ commit nếu có thay đổi thực sự
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date +'%Y-%m-%d %H:%M UTC')
            git commit -m "data: update weather data - ${DATE}"
            git push origin HEAD
          fi
